# Kanalen voor de verzamelaar (CLAUDE.md §Verzamelaar).
#
# `vast`: de verzamelaar leest elke run de nieuwste uploads en haalt reviews van modellen
# uit de sitemap van Plinkie op naar raw/videos/. Alleen jij voegt hier een kanaal toe,
# meestal vanuit onderzoek/kanaalvoorstellen.md.
#
# `genegeerd`: kanalen die de verkenning niet meer mag voorstellen, met de reden.
#
# Velden per kanaal:
#   naam:          zoals het kanaal zichzelf noemt
#   url:           de /videos-pagina van het kanaal
#   taal:          taal van de video's; wordt --sub-lang bij het ophalen en de titeltaal
#   ook_aanbieder: slug van de entiteit als het kanaal zelf leaset of verkoopt (belang)
#   uploads:       hoeveel van de nieuwste uploads elke run gelezen worden
#   uitsluiten:    titelpatronen (reguliere expressie, hoofdletters maken niet uit) van video's die
#                  een model noemen maar geen review zijn, zoals pechhulp-afleveringen

vast:
  - naam: ANWB
    url: https://www.youtube.com/@ANWB/videos
    taal: nl
    ook_aanbieder: anwb-private-lease
    uploads: 40
    uitsluiten: "wegenwacht|pech|repareert|lekke band"
  - naam: Autovisie
    url: https://www.youtube.com/@Autovisie/videos
    taal: nl
    uploads: 40
  - naam: AutoWeek
    url: https://www.youtube.com/@AutoWeek/videos
    taal: nl
    uploads: 40
  # Toegevoegd 06-10-2026 op verzoek van de eigenaar. Brits: prijzen in ponden en uitvoeringen
  # van de Britse markt, dus bij Process nagaan wat ook in Nederland geldt. Gaat ook over energie
  # en zonnepanelen; die video's vallen af omdat er geen model van Plinkie in de titel staat.
  - naam: Fully Charged Show
    url: https://www.youtube.com/@fullychargedshow/videos
    taal: en
    uploads: 40

genegeerd: []

# Webbronnen: geschreven reviews en themaartikelen (onderzoek/webbronnen.py, CLAUDE.md §Verzamelaar).
# Toegevoegd 06-10-2026 op verzoek van de eigenaar. robots.txt van anwb.nl staat deze paden toe.
#   overzicht:            elke run de nieuwste reviews van deze pagina
#   knooppunten, sitemap: alleen bij een verkenning, om oudere reviews te vinden via de modelpagina's
#   artikelen:            vaste themaartikelen, opnieuw opgehaald na ververs_dagen
web:
  - naam: ANWB
    taal: nl
    ook_aanbieder: anwb-private-lease
    overzicht: https://www.anwb.nl/auto/tests/auto-reviews
    review_patroon: /auto/tests/auto-reviews/detail/[0-9a-f]{32}
    knooppunten:
      - https://www.anwb.nl/auto/elektrisch-rijden/elektrische-autos
    sitemap: https://www.anwb.nl/sitemap.xml
    sitemap_filter: /auto/sitemap-
    sitemap_patroon: /auto/elektrisch-rijden/elektrische-autos/
    modelpagina_patroon: /auto/informatie/[^"#?]+
    ververs_dagen: 90
    # goedkoopste-elektrische-auto bewust niet: gaat over occasions (06-10-2026)
    artikelen:
      - https://www.anwb.nl/auto/elektrisch-rijden/elektrische-autos/elektrische-auto-met-trekhaak
      - https://www.anwb.nl/auto/elektrisch-rijden/elektrische-autos/elektrische-caravantrekker
      - https://www.anwb.nl/auto/elektrisch-rijden/elektrische-autos/elektrische-auto-met-grootste-actieradius
      - https://www.anwb.nl/auto/elektrisch-rijden/elektrische-autos/garantie-op-elektrische-autos-hoe-zit-dat
      - https://www.anwb.nl/auto/elektrisch-rijden/elektrische-autos/verwachte-elektrische-autos
