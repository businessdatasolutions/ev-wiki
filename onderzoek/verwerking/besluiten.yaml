# Nieuwe concepten die een agent voorstelde, met de definitie waarmee de pagina begint.
nieuwe_concepten:
  voorconditioneren:
    naam: Voorconditioneren
    definitie: >-
      De accu vóór het snelladen op temperatuur brengen, zodat de auto sneller laadt. Of en hoe een
      auto dat doet, verandert de laadtijd onderweg meer dan het maximale laadvermogen.
  wegenbelasting:
    naam: Wegenbelasting
    definitie: >-
      Motorrijtuigenbelasting voor elektrische auto's, die sinds 2025 stap voor stap wordt ingevoerd en
      afhangt van het gewicht. Bij private lease zit hij in het maandbedrag, dus een zware auto is
      duurder om te leasen, ook als de aanbieder het niet apart noemt.
  garantie:
    naam: Garantie
    definitie: >-
      De belofte van de fabrikant om gebreken te herstellen, apart voor de auto en voor de accu, elk
      met een termijn in jaren en kilometers (wat het eerst komt). Bij de accu hoort een minimale
      State of Health: zakt de capaciteit daaronder, dan repareert of vervangt de fabrikant hem; bij de
      meeste merken 70%. Bij private lease draagt de leasemaatschappij het risico, maar een korte
      garantie kan in het maandbedrag zitten.
  bidirectioneel-laden:
    naam: Bidirectioneel laden
    definitie: >-
      De auto levert stroom terug: aan apparaten (vehicle-to-load), aan het huis (vehicle-to-home) of
      aan het net (vehicle-to-grid). Welke vorm een auto kan, verschilt per model en uitvoering.

